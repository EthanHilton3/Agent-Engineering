<body>
<canvas id="game" width="320" height="218" aria-label="Kirby platformer"></canvas>
<script>
'use strict';
// =====================================================================
//  CORE SETUP
// =====================================================================
const W = 320, H = 218, HUD_H = 16, VIEW_H = 192, CTRL_Y = HUD_H + VIEW_H, TS = 16;
const STEP = 1000 / 60;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const k = s >= 1 ? Math.floor(s) : s;
  cv.style.width = (W * k) + 'px';
  cv.style.height = (H * k) + 'px';
}
addEventListener('resize', resize);
resize();

// Limited palette
const C = {
  ink: '#22132e', white: '#fff7ef',
  pink: '#ff8cc6', pinkL: '#ffc8e4', pinkD: '#e0559f', blush: '#ff4f8b',
  red: '#e8294f', redD: '#99173d', mouth: '#5a0c2c', tongue: '#ff6b8a',
  eye: '#151b55', eyeHi: '#4d74ff',
  orange: '#f78a2f', orangeD: '#c45a1c', tan: '#ffd9a8',
  yellow: '#ffe14d', yellowD: '#f5a524', gold: '#c8741a',
  purple: '#a45ee0', purpleD: '#6b36aa', lilac: '#dcb8ff',
  green: '#5ccb3c', greenD: '#2f8c37', greenL: '#aaee60', greenDD: '#1b5a2d',
  dirt: '#b9703f', dirtD: '#7e4428', dirtL: '#dc955c',
  wood: '#c58447', woodD: '#7f4b25', woodL: '#e8b071',
  gray: '#8f96b6', grayD: '#565c80', grayL: '#cfd4ec',
  sky0: '#5cc0ff', sky1: '#84d2ff', sky2: '#aee3ff', sky3: '#d8f4ff',
  farH: '#a2d8cb', farHL: '#c9efe4', farHD: '#88c6b8',
  nearH: '#7dd36a', nearHL: '#a6e88a', nearHD: '#63bb55', nearHE: '#3c8c43',
  cloud: '#ffffff', cloudD: '#d0e9ff', cyan: '#8ff2ff',
  hud: '#1d1133', hudL: '#3c2660', hudM: '#2a1a48'
};

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const rr = (a, b) => a + Math.random() * (b - a);
const pad = (n, l = 7) => String(Math.max(0, n | 0)).padStart(l, '0');
function overlap(a, b, s = 0) {
  return a.x + s < b.x + b.w - s && a.x + a.w - s > b.x + s &&
         a.y + s < b.y + b.h - s && a.y + a.h - s > b.y + s;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// =====================================================================
//  PIXEL GRID SPRITE FACTORY  (all art is generated here, in code)
// =====================================================================
const rgbCache = {};
function hexRgb(h) {
  if (rgbCache[h]) return rgbCache[h];
  const n = parseInt(h.slice(1), 16);
  return (rgbCache[h] = [n >> 16 & 255, n >> 8 & 255, n & 255]);
}
function pip(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
class Grid {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Array(w * h).fill(null); }
  get(x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : this.d[y * this.w + x]; }
  px(x, y, c, only) {
    x = Math.floor(x); y = Math.floor(y);
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    const i = y * this.w + x;
    if (only && !only.includes(this.d[i])) return;
    this.d[i] = c;
  }
  rect(x, y, w, h, c, only) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.px(x + i, y + j, c, only); }
  inEll(x, y, cx, cy, rx, ry) { const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry; return dx * dx + dy * dy <= 1; }
  ell(cx, cy, rx, ry, c, only) {
    for (let y = Math.floor(cy - ry) - 1; y <= Math.ceil(cy + ry) + 1; y++)
      for (let x = Math.floor(cx - rx) - 1; x <= Math.ceil(cx + rx) + 1; x++)
        if (this.inEll(x, y, cx, cy, rx, ry)) this.px(x, y, c, only);
  }
  crescent(cx, cy, rx, ry, ox, oy, c, only) {
    for (let y = Math.floor(cy - ry) - 1; y <= Math.ceil(cy + ry) + 1; y++)
      for (let x = Math.floor(cx - rx) - 1; x <= Math.ceil(cx + rx) + 1; x++)
        if (this.inEll(x, y, cx, cy, rx, ry) && !this.inEll(x, y, cx + ox, cy + oy, rx, ry)) this.px(x, y, c, only);
  }
  poly(pts, c, only) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    for (let y = Math.floor(y0); y <= Math.ceil(y1); y++)
      for (let x = Math.floor(x0); x <= Math.ceil(x1); x++)
        if (pip(x + .5, y + .5, pts)) this.px(x, y, c, only);
  }
  outline(c) {
    const add = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (this.d[y * this.w + x] !== null) continue;
      for (const v of [this.get(x - 1, y), this.get(x + 1, y), this.get(x, y - 1), this.get(x, y + 1)])
        if (v !== null && v !== c) { add.push(y * this.w + x); break; }
    }
    for (const i of add) this.d[i] = c;
  }
  toCanvas() {
    const c = document.createElement('canvas'); c.width = this.w; c.height = this.h;
    const x = c.getContext('2d'), id = x.createImageData(this.w, this.h);
    for (let i = 0; i < this.d.length; i++) {
      const col = this.d[i]; if (!col) continue;
      const [r, g, b] = hexRgb(col);
      id.data[i * 4] = r; id.data[i * 4 + 1] = g; id.data[i * 4 + 2] = b; id.data[i * 4 + 3] = 255;
    }
    x.putImageData(id, 0, 0);
    return c;
  }
}
function flipH(c) {
  const f = document.createElement('canvas'); f.width = c.width; f.height = c.height;
  const x = f.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0);
  return f;
}
function sprite(w, h, fn) { const g = new Grid(w, h); fn(g); const r = g.toCanvas(); return { r, l: flipH(r) }; }
function makeLayer(w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'), id = x.createImageData(w, h);
  fn((px, py, col) => {
    if (px < 0 || py < 0 || px >= w || py >= h) return;
    const [r, g, b] = hexRgb(col), i = (py * w + px) * 4;
    id.data[i] = r; id.data[i + 1] = g; id.data[i + 2] = b; id.data[i + 3] = 255;
  });
  x.putImageData(id, 0, 0);
  return c;
}

// ---------------------------------------------------------------- Kirby
const SKIN = [C.pink, C.pinkD, C.pinkL];
const SKINB = [C.pink, C.pinkD, C.pinkL, C.blush];
function drawFace(g, cx, cy, rx, ry, o) {
  const ex = Math.round(cx + (o.ex ?? 1)), ey = Math.round(cy - 5 + (o.ey ?? 0));
  const E = C.eye, eyes = o.eyes || 'open';
  if (o.cheeks !== false) {
    const cw = o.puff ? 3 : 2, ch = o.puff ? 2 : 1;
    g.rect(ex - 1 - cw, ey + 5, cw, ch, C.blush, SKIN);
    g.rect(ex + 5, ey + 5, cw, ch, C.blush, SKIN);
  }
  if (eyes === 'open') {
    for (const x of [ex, ex + 3]) { g.rect(x, ey, 2, 4, E); g.px(x, ey, C.white); g.px(x + 1, ey + 3, C.eyeHi); }
  } else if (eyes === 'blink') {
    g.rect(ex, ey + 2, 2, 1, E); g.rect(ex + 3, ey + 2, 2, 1, E);
  } else if (eyes === 'shut') {
    g.px(ex, ey + 1, E); g.px(ex + 1, ey + 2, E); g.px(ex, ey + 3, E);
    g.px(ex + 4, ey + 1, E); g.px(ex + 3, ey + 2, E); g.px(ex + 4, ey + 3, E);
  } else if (eyes === 'x') {
    for (const x of [ex - 1, ex + 3]) { g.px(x, ey + 1, E); g.px(x + 2, ey + 1, E); g.px(x + 1, ey + 2, E); g.px(x, ey + 3, E); g.px(x + 2, ey + 3, E); }
  } else if (eyes === 'happy') {
    for (const x of [ex - 1, ex + 3]) { g.px(x, ey + 2, E); g.px(x + 1, ey + 1, E); g.px(x + 2, ey + 2, E); }
  }
  const m = o.mouth || 'small', mx = ex + 2, my = ey + 5;
  if (m === 'small') g.px(mx, my, C.mouth);
  else if (m === 'smile') { g.px(mx - 1, my, C.mouth); g.px(mx, my + 1, C.mouth); g.px(mx + 1, my, C.mouth); }
  else if (m === 'o') g.rect(mx, my, 2, 2, C.mouth);
  else if (m === 'wavy') { g.px(mx - 1, my + 1, C.mouth); g.px(mx, my, C.mouth); g.px(mx + 1, my + 1, C.mouth); g.px(mx + 2, my, C.mouth); }
  else if (m === 'spit') { g.ell(cx + rx - 2.6, cy + 0.8, 2.4, 2.8, C.mouth, SKINB); }
  else if (m === 'big') {
    const s = o.ms || 1, mcx = cx + rx - 2.2, mcy = cy + 1.2;
    g.ell(mcx, mcy, 3.3 * s, 4.4 * s, C.mouth, SKINB);
    g.ell(mcx - 0.8, mcy + 2.8 * s, 2.4 * s, 1.6 * s, C.tongue, [C.mouth]);
  }
}
function kirbyArt(o) {
  return sprite(32, 32, g => {
    const cx = o.cx ?? 16, cy = o.cy ?? 22, rx = o.rx ?? 7.5, ry = o.ry ?? 7;
    for (const a of (o.arms || [])) g.ell(a[0], a[1], a[2] || 2.4, a[3] || 2.2, C.pink);
    g.ell(cx, cy, rx, ry, C.pink);
    g.outline(C.ink);
    g.crescent(cx, cy, rx, ry, -0.9, -1.7, C.pinkD, [C.pink]);
    g.ell(cx - rx * 0.42, cy - ry * 0.55, Math.max(1.2, rx * 0.2), Math.max(1, ry * 0.13), C.pinkL, [C.pink]);
    for (const f of (o.feet || [])) {
      const frx = f[2] || 3.6, fry = f[3] || 2.1;
      g.ell(f[0], f[1], frx + 1, fry + 1, C.ink);
      g.ell(f[0], f[1], frx, fry, C.red);
      g.crescent(f[0], f[1], frx, fry, 0, -1.1, C.redD, [C.red]);
    }
    g.outline(C.ink);
    drawFace(g, cx, cy, rx, ry, o);
  });
}
const FEET_IDLE = [[12, 28.6], [20, 28.6]];
const ARMS_IDLE = [[8.8, 23.6], [23.2, 23.6]];
const FULL = { rx: 9.4, ry: 8.2, cy: 21, feet: [[11, 28.8, 3.4, 1.9], [21, 28.8, 3.4, 1.9]], arms: [[6, 22.5], [26, 22.5]], mouth: 'wavy', puff: true, ex: 1.5 };
const K = {
  idle: [kirbyArt({ feet: FEET_IDLE, arms: ARMS_IDLE }), kirbyArt({ feet: FEET_IDLE, arms: ARMS_IDLE, eyes: 'blink' })],
  run: [
    kirbyArt({ feet: [[10.5, 28.6], [21.5, 28.6]], arms: [[9, 22.6], [23.4, 24.2]] }),
    kirbyArt({ cy: 21, feet: [[14, 27.6], [19, 28.6]], arms: [[9, 22], [23.2, 22.6]] }),
    kirbyArt({ feet: [[11.5, 28.6], [21, 28.6]], arms: [[9, 24.2], [23.4, 22.6]] }),
    kirbyArt({ cy: 21, feet: [[13, 28.6], [19.5, 27.6]], arms: [[9, 22.6], [23.2, 22]] }),
  ],
  jump: kirbyArt({ rx: 7, ry: 7.6, cy: 21.2, feet: [[13.5, 28.6, 3, 2], [18.5, 28.6, 3, 2]], arms: [[9.2, 17.5], [22.8, 17.5]] }),
  fall: kirbyArt({ rx: 7.8, ry: 6.8, cy: 21.6, feet: [[11, 28.4], [21, 28.4]], arms: [[7.4, 19], [24.6, 19]], mouth: 'o' }),
  land: kirbyArt({ rx: 8.8, ry: 5.8, cy: 23.4, feet: [[11, 28.6], [21, 28.6]], arms: [[7.2, 25], [24.8, 25]], eyes: 'blink', ey: 1 }),
  duck: kirbyArt({ rx: 9.2, ry: 5, cy: 24.4, feet: [[11, 28.6], [21, 28.6]], arms: [[7, 26], [25, 26]], ey: 1.6, cheeks: false }),
  slide: kirbyArt({ rx: 9, ry: 5, cy: 24.4, feet: [[9, 28.6], [25.5, 28, 3.4, 2]], arms: [[8, 23], [21, 26.5]], ey: 1.6, ex: 2, mouth: 'o', cheeks: false }),
  roll: kirbyArt({ cy: 16, rx: 7, ry: 7, feet: [[12.5, 22, 3, 1.8], [19.5, 22, 3, 1.8]], arms: [[9, 12.5], [23, 12.5]], eyes: 'shut' }),
  fly: [
    kirbyArt({ cy: 19, rx: 9.6, ry: 9.2, feet: [[12, 28.8, 2.6, 1.7], [20, 28.8, 2.6, 1.7]], arms: [[6.3, 11.6, 2.6, 2.2], [25.7, 11.6, 2.6, 2.2]], mouth: 'o', puff: true, ex: 2, ey: -0.5 }),
    kirbyArt({ cy: 19, rx: 9.6, ry: 9.2, feet: [[12, 28.8, 2.6, 1.7], [20, 28.8, 2.6, 1.7]], arms: [[5.6, 21, 2.6, 2.2], [26.4, 21, 2.6, 2.2]], mouth: 'o', puff: true, ex: 2, ey: -0.5 }),
  ],
  inhale: [0.7, 1.05, 1.25].map(s => kirbyArt({ rx: 7.8, feet: [[11, 28.6], [21.5, 28.6]], arms: [[8, 21], [23.8, 25]], eyes: 'shut', ex: -5, ey: -0.5, mouth: 'big', ms: s, cheeks: false })),
  full: [kirbyArt(FULL), kirbyArt({ ...FULL, eyes: 'blink' })],
  fullWalk: [
    kirbyArt({ ...FULL, feet: [[10.5, 28.8, 3.4, 1.9], [21.5, 28.2, 3.4, 1.9]] }),
    kirbyArt({ ...FULL, cy: 20.5, feet: [[11.5, 28.2, 3.4, 1.9], [21, 28.8, 3.4, 1.9]] }),
  ],
  fullJump: kirbyArt({ ...FULL, cy: 20.5, feet: [[12.5, 28.6, 3, 1.8], [19.5, 28.6, 3, 1.8]], arms: [[6, 18.5], [26, 18.5]] }),
  gulp: kirbyArt({ ...FULL, rx: 10, ry: 7.4, cy: 22.2, eyes: 'shut', ex: 0.5 }),
  spit: kirbyArt({ rx: 7, ry: 7.4, cy: 21.6, feet: FEET_IDLE, arms: [[9.4, 20.6], [23, 20.6]], mouth: 'spit', ex: 0 }),
  swallow: kirbyArt({ rx: 8.4, ry: 6.4, cy: 22.8, feet: FEET_IDLE, arms: [[7.8, 24], [24.2, 24]], eyes: 'shut', mouth: 'smile', ex: 0, ey: 0.6 }),
  hurt: kirbyArt({ rx: 7.2, ry: 7.2, cy: 21.6, feet: FEET_IDLE, arms: [[7, 19.5], [25, 19.5]], eyes: 'x', mouth: 'o' }),
  dead: kirbyArt({ cy: 16, rx: 7.4, ry: 7.4, feet: [[12, 22.6, 3, 1.8], [20, 22.6, 3, 1.8]], arms: [[7, 13.5], [25, 13.5]], eyes: 'x', mouth: 'o' }),
  win: kirbyArt({ feet: FEET_IDLE, arms: [[6.6, 18.5], [25.4, 18.5]], eyes: 'happy', mouth: 'smile' }),
};

// ---------------------------------------------------------------- Enemies
function waddleArt(f, stun) {
  return sprite(24, 24, g => {
    g.ell(12, 14.5, 7.4, 6.6, C.orange);
    g.outline(C.ink);
    g.crescent(12, 14.5, 7.4, 6.6, -0.8, -1.5, C.orangeD, [C.orange]);
    g.ell(8.5, 10.8, 1.6, 1, C.tan, [C.orange]);
    const fl = f === 0 ? [[8, 20.8], [16.5, 20.2]] : [[8.5, 20.2], [16, 20.8]];
    for (const ft of fl) { g.ell(ft[0], ft[1], 3.6, 2.1, C.ink); g.ell(ft[0], ft[1], 2.6, 1.2, C.yellowD); }
    g.outline(C.ink);
    g.ell(14.6, 14.2, 4.8, 4.3, C.tan, [C.orange, C.orangeD]);
    if (stun) { g.rect(12, 13, 2, 1, C.ink); g.rect(16, 13, 2, 1, C.ink); }
    else { g.rect(13, 11, 1, 3, C.ink); g.rect(16, 11, 1, 3, C.ink); }
    g.rect(11, 15, 2, 1, C.blush, [C.tan]); g.rect(17, 15, 2, 1, C.blush, [C.tan]);
  });
}
function brontoArt(f, stun) {
  return sprite(24, 24, g => {
    if (f === 0) g.ell(8.5, 6.5, 3.2, 4.2, C.white); else g.ell(6.5, 13, 4.6, 2.6, C.white);
    g.ell(12.5, 14.5, 6.8, 6.2, C.purple);
    g.ell(10, 21, 2, 1.3, C.orange); g.ell(15, 21, 2, 1.3, C.orange);
    g.outline(C.ink);
    g.crescent(12.5, 14.5, 6.8, 6.2, -0.9, -1.5, C.purpleD, [C.purple]);
    g.ell(10, 11, 1.8, 1.1, C.lilac, [C.purple]);
    if (f === 0) g.rect(8, 4, 1, 5, C.grayL, [C.white]); else g.rect(3, 13, 6, 1, C.grayL, [C.white]);
    if (stun) { g.rect(14, 13, 2, 1, C.ink); g.rect(17, 13, 2, 1, C.ink); }
    else { g.rect(15, 11, 1, 3, C.ink); g.rect(18, 11, 1, 3, C.ink); }
    g.rect(13, 16, 2, 1, C.blush, [C.purple, C.purpleD]); g.px(19, 16, C.blush, [C.purple, C.purpleD]);
  });
}
function hopperArt(k, stun) {
  const s = [{ cy: 16.5, rx: 8, ry: 6.5 }, { cy: 18.5, rx: 9.3, ry: 4.8 }, { cy: 14, rx: 6.3, ry: 8.3 }][k];
  return sprite(24, 24, g => {
    g.ell(12, s.cy, s.rx, s.ry, C.green);
    for (let x = 0; x < 24; x++) g.d[23 * 24 + x] = null;
    g.outline(C.ink);
    g.crescent(12, s.cy, s.rx, s.ry, -1, -1.6, C.greenD, [C.green]);
    g.ell(12 - s.rx * 0.45, s.cy - s.ry * 0.5, 1.6, 1.1, C.greenL, [C.green]);
    const ex = 13, ey = Math.round(s.cy - s.ry * 0.4);
    if (stun) { g.rect(ex, ey + 1, 2, 1, C.ink); g.rect(ex + 4, ey + 1, 2, 1, C.ink); }
    else { g.rect(ex, ey, 2, 3, C.white); g.rect(ex + 4, ey, 2, 3, C.white); g.rect(ex + 1, ey + 1, 1, 2, C.ink); g.rect(ex + 5, ey + 1, 1, 2, C.ink); }
    g.rect(ex + 2, ey + 4, 2, 1, C.ink);
  });
}
function gordoArt(f) {
  return sprite(24, 24, g => {
    const L = f ? 11.2 : 10.2;
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4;
      g.poly([[12 + Math.cos(a) * L, 12 + Math.sin(a) * L],
              [12 + Math.cos(a + 0.45) * 6, 12 + Math.sin(a + 0.45) * 6],
              [12 + Math.cos(a - 0.45) * 6, 12 + Math.sin(a - 0.45) * 6]], C.grayL);
    }
    g.ell(12, 12, 7, 7, C.purpleD);
    g.outline(C.ink);
    g.crescent(12, 12, 7, 7, -1, -1.5, C.hudL, [C.purpleD]);
    g.ell(9, 8.5, 1.6, 1.1, C.purple, [C.purpleD]);
    g.rect(9, 9, 2, 4, C.white); g.rect(13, 9, 2, 4, C.white);
    g.rect(10, 10, 1, 2, C.ink); g.rect(14, 10, 1, 2, C.ink);
  });
}
function starArt(size, rot, outline, sx = 1) {
  return sprite(size, size, g => {
    const c = size / 2, R = size / 2 - 1.5, r = R * 0.48, pts = [];
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + rot + i * Math.PI / 5, d = i % 2 ? r : R;
      pts.push([c + Math.cos(a) * d * sx, c + Math.sin(a) * d]);
    }
    g.poly(pts, C.yellow);
    g.outline(outline || C.gold);
    g.crescent(c, c, R * 0.75, R * 0.75, -1, -1, C.yellowD, [C.yellow]);
    g.ell(c - R * 0.12, c - R * 0.12, Math.max(1, R * 0.2), Math.max(1, R * 0.2), C.white, [C.yellow, C.yellowD]);
  });

// ---------- Music: original upbeat chiptune loop
const NOTE = n => {
  const m = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[n[0]];
  let i = 1, acc = 0;
  if (n[1] === '#') { acc = 1; i = 2; }
  const oct = +n.slice(i);
  return 440 * Math.pow(2, ((oct + 1) * 12 + m + acc - 69) / 12);
};
const MEL = ('G4 C5 E5 G5 E5 C5 D5 E5 A5 - G5 E5 C5 - A4 . F4 A4 C5 F5 E5 D5 C5 A4 B4 - D5 G5 F5 E5 D5 B4 ' +
             'C5 E5 G5 C6 B5 G5 E5 G5 A5 G5 E5 C5 A4 C5 E5 A5 F5 E5 D5 C5 D5 - G4 B4 C5 - - . G4 . C5 .').split(' ');
const ROOTS = { C: 48, A: 45, F: 41, G: 43 };
const CHORDS = ['C', 'A', 'F', 'G', 'C', 'A', 'F', 'C'];
const Music = {
  on: false, step: 0, next: 0, spb: 0.165,
  start() { this.step = 0; this.resume(); },
  resume() { if (!AU.ctx) return; this.on = true; this.next = AU.ctx.currentTime + 0.08; },
  pause() { this.on = false; },
  stop() { this.on = false; this.step = 0; },
  update() {
    if (!this.on || !AU.ctx) return;
    const c = AU.ctx;
    if (this.next < c.currentTime - 0.3) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.15) {
      this.play(this.step, this.next);
      this.next += this.spb;
      this.step = (this.step + 1) % 64;
    }
  },
  play(s, t) {
    const n = MEL[s];
    if (n && n !== '-' && n !== '.') {
      let len = 1;
      while (MEL[(s + len) % 64] === '-') len++;
      const f = NOTE(n), d = len * this.spb * 0.92;
      AU.tone(f, d, { type: 'square', vol: 0.055, dest: AU.mus, at: t });
      AU.tone(f, d, { type: 'triangle', vol: 0.06, dest: AU.mus, at: t });
    }
    const bar = (s / 8) | 0, b = s % 8;
    let ch = CHORDS[bar];
    if (bar === 6 && b >= 4) ch = 'G';
    if (b % 2 === 0) {
      const root = ROOTS[ch], off = [0, 7, 12, 7][b / 2];
      AU.tone(440 * Math.pow(2, (root + off - 69) / 12), this.spb * 1.6, { type: 'triangle', vol: 0.24, dest: AU.mus, at: t });
    }
    if (b % 4 === 0) AU.tone(130, 0.09, { type: 'sine', slide: 45, vol: 0.35, dest: AU.mus, at: t });
    if (b % 4 === 2) AU.noise(0.08, { freq: 1900, vol: 0.09, dest: AU.mus, at: t });
    if (b % 2 === 1) AU.noise(0.03, { freq: 8000, ftype: 'highpass', vol: 0.05, dest: AU.mus, at: t });
  }
};

// =====================================================================

// =====================================================================
function colColumn(tx, e) {
  const t0 = Math.floor(e.y / 16), t1 = Math.floor((e.y + e.h - 0.001) / 16);
  for (let ty = t0; ty <= t1; ty++) if (isSolid(tileAt(tx, ty))) return true;
  return false;
}
function moveEntity(e, oneWay = true) {
  let hitX = false;
  e.x += e.vx;
  if (e.vx > 0) { const tx = Math.floor((e.x + e.w - 0.001) / 16); if (colColumn(tx, e)) { e.x = tx * 16 - e.w; hitX = true; } }
  else if (e.vx < 0) { const tx = Math.floor(e.x / 16); if (colColumn(tx, e)) { e.x = (tx + 1) * 16; hitX = true; } }
  if (hitX) e.vx = 0;
  const oldB = e.y + e.h;
  e.y += e.vy;
  e.onGround = false;
  const l = Math.floor(e.x / 16), r = Math.floor((e.x + e.w - 0.001) / 16);
  if (e.vy > 0) {
    const ty = Math.floor((e.y + e.h - 0.001) / 16);
    for (let tx = l; tx <= r; tx++) {
      const t = tileAt(tx, ty);
      if (isSolid(t) || (oneWay && t === PLAT && oldB <= ty * 16 + 0.5)) {
        e.y = ty * 16 - e.h; e.vy = 0; e.onGround = true; e.landTile = t; break;
      }
    }
  } else if (e.vy < 0) {
    const ty = Math.floor(e.y / 16);
    for (let tx = l; tx <= r; tx++) if (isSolid(tileAt(tx, ty))) { e.y = (ty + 1) * 16; e.vy = 0; break; }
  }
  return hitX;
}
function nearGround(e, d) {
  const ty = Math.floor((e.y + e.h + d) / 16), l = Math.floor(e.x / 16), r = Math.floor((e.x + e.w - 0.01) / 16);
  for (let tx = l; tx <= r; tx++) { const t = tileAt(tx, ty); if (isSolid(t) || t === PLAT) return true; }
  return false;
}
function onOneWayOnly(e) {
  const ty = Math.floor((e.y + e.h + 1) / 16), l = Math.floor(e.x / 16), r = Math.floor((e.x + e.w - 0.01) / 16);
  let plat = false;
  for (let tx = l; tx <= r; tx++) { const t = tileAt(tx, ty); if (isSolid(t)) return false; if (t === PLAT) plat = true; }
  return plat;
}
function los(x0, y0, x1, y1, ignore = -1) {
  const steps = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 4);
  for (let i = 1; i < steps; i++) {
    const x = x0 + (x1 - x0) * i / steps, y = y0 + (y1 - y0) * i / steps;
    const tx = Math.floor(x / 16), ty = Math.floor(y / 16);
    if (ty < 0 || ty >= LH) continue;
    if (ty * LW + tx === ignore) continue;
    if (isSolid(tileAt(tx, ty))) return false;
  }
  return true;
}
function groundAhead(e, dx) {
  const tx = Math.floor((e.x + e.w / 2 + dx) / 16), ty0 = Math.floor((e.y + e.h) / 16);
  for (let ty = ty0; ty <= ty0 + 3; ty++) { const t = tileAt(tx, ty); if (isSolid(t) || t === PLAT) return true; }
  return false;
}

function update() {

      if (hit('act') || hit('jump')) startGame();

    case 'play':

        G.state = 'pause'; Music.pause(); AU.inhaleStop(); sfx('pause');
        break;
      }

    case 'pause':
      if (hit('pause')) { G.state = 'play'; Music.resume(); if (P.state === 'inhale') AU.inhaleStart(); }

    case 'gameover':

  drawText('STAGE CLEAR!', W / 2, 34, C.yellow, 3, { align: 'center', outline: C.ink, thick: 1, shadow: true });
  const flip = (G.clearT >> 4) & 1, hop = Math.abs(Math.round(Math.sin(G.clearT * 0.2) * 5));
  ctx.drawImage(flip ? K.win.l : K.win.r, W / 2 - 16, 50 - hop);
  const t = G.tally, row = (i, label, val, col) => {
    if (G.clearT < 30 + i * 18) return;
    const y = 92 + i * 12;
    drawText(label, 70, y, C.white);
    drawText(val, 250, y, col, 1, { align: 'right' });
  };
  row(0, 'SCORE', pad(t.base), C.white);
  row(1, 'TIME ' + Math.floor(t.secs / 60) + ':' + pad(t.secs % 60, 2) + '  BONUS', '+' + t.time, C.cyan);
  row(2, 'LIVES BONUS', '+' + t.life, C.pink);
  if (G.clearT >= 84) {
    ctx.fillStyle = C.hudL; ctx.fillRect(70, 129, 180, 1);
    const shown = Math.min(G.score, t.base + Math.floor((G.clearT - 84) / 40 * (t.time + t.life)));
    drawText('TOTAL', 70, 134, C.yellow);
    drawText(pad(shown), 250, 134, C.yellow, 1, { align: 'right' });
  }
  if (G.newHi && G.clearT > 130 && (G.t >> 3) & 1) drawText('NEW HIGH SCORE!', W / 2, 150, C.pink, 1, { align: 'center' });
  if (G.clearT > 130 && (G.t >> 5) & 1) drawText('PRESS ENTER TO PLAY AGAIN', W / 2, 172, C.white, 1, { align: 'center' });
}
function render() {
  ctx.fillStyle = C.hud; ctx.fillRect(0, 0, W, H);
  drawWorld();
  if (G.state !== 'title') drawHUD();
  drawControls();
  drawBanner();
  if (G.state === 'title') drawTitle();
  else if (G.state === 'pause') drawPause();
  else if (G.state === 'gameover') drawGameOver();
  else if (G.state === 'clear') drawClear();
}

// =====================================================================
//  BOOT
// =====================================================================
document.addEventListener('visibilitychange', () => {
  if (document.hidden && G.state === 'play' && P.state !== 'dead' && P.state !== 'ride') {
    G.state = 'pause'; Music.pause(); AU.inhaleStop();
  }
});
buildMap(); genDecor(); buildObjects(); spawnPlayer();
G.state = 'title';
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  Music.update();
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// test hook (harmless in normal play)
window.__game = { G, P, get ents() { return ents; }, startGame, tileAt };
</script>
